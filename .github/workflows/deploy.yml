name: Build and deploy to Timeweb

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Validate JavaScript
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify build output
        run: node scripts/check-dist.mjs
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Check PHP syntax
        run: find dist/api -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke test PHP endpoints
        shell: bash
        run: |
          cp -a dist "$RUNNER_TEMP/pbp-smoke"
          php -S 127.0.0.1:8087 -t "$RUNNER_TEMP/pbp-smoke" >/tmp/pbp-php-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for try in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8087/api/public.php -o /tmp/pbp-settings.json; then break; fi
            sleep 1
          done
          grep -q 'primary_phone' /tmp/pbp-settings.json
          curl -fsS http://127.0.0.1:8087/api/admin.php?action=session | grep -q 'csrf'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8087/api/settings.php)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://127.0.0.1:8087/api/submit.php)" = 422
      - name: Ensure release contains no runtime data
        run: |
          test -z "$(find dist/api/private -maxdepth 1 -type f ! -name '.htaccess' -print -quit)"
      - name: Verify Timeweb secrets
        env:
          FTP_HOST: ${{ secrets.TIMEWEB_FTP_HOST }}
          FTP_USER: ${{ secrets.TIMEWEB_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          FTP_DIR: ${{ secrets.TIMEWEB_FTP_DIR }}
        shell: bash
        run: |
          for key in FTP_HOST FTP_USER FTP_PASSWORD FTP_DIR; do
            if [[ -z "${!key}" ]]; then
              echo "::error::Missing Timeweb secret: $key"
              exit 1
            fi
          done
          echo "Required secrets configured."
      - name: Publish over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.TIMEWEB_FTP_HOST }}
          username: ${{ secrets.TIMEWEB_FTP_USER }}
          password: ${{ secrets.TIMEWEB_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./dist/
          server-dir: ${{ endsWith(secrets.TIMEWEB_FTP_DIR, '/') && secrets.TIMEWEB_FTP_DIR || format('{0}/', secrets.TIMEWEB_FTP_DIR) }}
          dangerous-clean-slate: false
          log-level: standard

      - name: Check live API and private storage protection
        run: |
          curl --fail --silent --show-error --location --max-time 15 http://bpreg.tw1.ru/api/public.php | grep -q 'primary_phone'
          curl --fail --silent --show-error --location --max-time 15 http://bpreg.tw1.ru/api/admin.php?action=session | grep -q 'csrf'
          private_status="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 http://bpreg.tw1.ru/api/private/access-check.txt)"
          if [[ "$private_status" != "403" ]]; then
            echo "::error::Private storage access control failed: HTTP $private_status"
            exit 1
          fi
          echo "Public API reachable; storage access denied."