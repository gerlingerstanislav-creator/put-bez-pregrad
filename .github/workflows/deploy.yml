name: Deploy isolated webroot to Timeweb

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timeweb-production
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PBP_ADMIN_PATH: ${{ secrets.PBP_ADMIN_PATH }}
      TIMEWEB_SSH_HOST: ${{ secrets.TIMEWEB_SSH_HOST }}
      TIMEWEB_SSH_PORT: ${{ secrets.TIMEWEB_SSH_PORT }}
      TIMEWEB_SSH_USER: ${{ secrets.TIMEWEB_SSH_USER }}
      TIMEWEB_SITE_ROOT: ${{ secrets.TIMEWEB_SITE_ROOT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify SSH migration configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "$PBP_ADMIN_PATH" && -n "$TIMEWEB_SSH_HOST" && -n "$TIMEWEB_SSH_USER" && -n "$TIMEWEB_SITE_ROOT" ]]
          [[ "$TIMEWEB_SSH_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
          [[ "$TIMEWEB_SSH_USER" =~ ^[a-zA-Z0-9._-]+$ ]]
          [[ "$TIMEWEB_SITE_ROOT" =~ ^/[a-zA-Z0-9._/-]+$ && "$TIMEWEB_SITE_ROOT" != "/" ]]
          [[ -z "$TIMEWEB_SSH_PORT" || "$TIMEWEB_SSH_PORT" =~ ^[0-9]{2,5}$ ]]
          [[ -n "$SSH_PRIVATE_KEY" && -n "$SSH_KNOWN_HOSTS" ]]
          echo 'SSH configuration is present.'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TIMEWEB_SSH_KNOWN_HOSTS }}

      - name: Install, validate and build
        run: |
          npm install --no-audit --no-fund
          npm run check
          npm run build
          node scripts/check-dist.mjs
          bash -n scripts/timeweb-prepare.sh scripts/timeweb-cutover.sh scripts/timeweb-rollback.sh scripts/timeweb-finish.sh

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
      - name: Install SMTP dependencies and verify PHP
        run: |
          composer install --working-dir=mail-php --no-interaction --no-dev --prefer-dist --optimize-autoloader
          cp -a mail-php/vendor dist/api/vendor
          find dist private-dist -type f -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
          php tests/php-spam.php
          php tests/php-email.php
          php -n tests/php-email.php
          node --test tests/php-bootstrap.test.mjs

      - name: Verify live TLS
        run: curl -fsSI --max-time 20 https://bpreg.tw1.ru/ >/dev/null

      - name: Configure verified SSH access
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.TIMEWEB_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.TIMEWEB_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" -p "${{ secrets.TIMEWEB_SSH_PORT }}" "$TIMEWEB_SSH_USER@$TIMEWEB_SSH_HOST" 'printf "SSH authenticated\n"'

      - name: Prepare expiring admin initialization
        id: bootstrap
        run: node scripts/create-admin-bootstrap.mjs

      - name: Create isolated server folders and copy any legacy state
        shell: bash
        run: |
          set -euo pipefail
          root_b64="$(printf '%s' "$TIMEWEB_SITE_ROOT" | base64 -w0)"
          ssh -o BatchMode=yes -i "$HOME/.ssh/id_ed25519" -p "$TIMEWEB_SSH_PORT" "$TIMEWEB_SSH_USER@$TIMEWEB_SSH_HOST" "SITE_ROOT_B64='$root_b64' bash -se" < scripts/timeweb-prepare.sh

      - name: Upload web and private PHP independently
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          remote="$TIMEWEB_SSH_USER@$TIMEWEB_SSH_HOST"
          ssh_command="ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i $HOME/.ssh/id_ed25519 -p $TIMEWEB_SSH_PORT"
          rsync -az --delete -e "$ssh_command" dist/ "$remote:$TIMEWEB_SITE_ROOT/web/"
          rsync -az --delete -e "$ssh_command" private-dist/admin-api/ "$remote:$TIMEWEB_SITE_ROOT/private/admin-api/"

      - name: Verify PHP storage and switch public_html to web
        id: cutover
        shell: bash
        run: |
          set -euo pipefail
          root_b64="$(printf '%s' "$TIMEWEB_SITE_ROOT" | base64 -w0)"
          ssh -o BatchMode=yes -i "$HOME/.ssh/id_ed25519" -p "$TIMEWEB_SSH_PORT" "$TIMEWEB_SSH_USER@$TIMEWEB_SSH_HOST" "SITE_ROOT_B64='$root_b64' bash -se" < scripts/timeweb-cutover.sh

      - name: Initialize or rotate admin password without replacing SMTP
        id: rotate_password
        env:
          PBP_ADMIN_PASSWORD_HASH: ${{ secrets.PBP_ADMIN_PASSWORD_HASH }}
        run: node scripts/apply-admin-bootstrap.mjs

      - name: Delete temporary bootstrap from private admin URL
        if: always() && steps.bootstrap.outcome == 'success' && steps.upload.outcome != 'skipped'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PBP_BOOTSTRAP_FILENAME" =~ ^setup-[0-9a-f]{48}\.php$ ]]
          root_b64="$(printf '%s' "$TIMEWEB_SITE_ROOT" | base64 -w0)"
          file_b64="$(printf '%s' "$PBP_ADMIN_PATH/api/$PBP_BOOTSTRAP_FILENAME" | base64 -w0)"
          ssh -o BatchMode=yes -i "$HOME/.ssh/id_ed25519" -p "$TIMEWEB_SSH_PORT" "$TIMEWEB_SSH_USER@$TIMEWEB_SSH_HOST" "ROOT_B64='$root_b64' FILE_B64='$file_b64' bash -se" <<'REMOTE'
          set -euo pipefail
          root="$(printf '%s' "$ROOT_B64" | base64 -d)"
          relative="$(printf '%s' "$FILE_B64" | base64 -d)"
          [[ "$relative" =~ ^[a-zA-Z0-9-]{20,80}/api/setup-[a-f0-9]{48}\.php$ ]]
          rm -f "$root/web/$relative"
          REMOTE

      - name: Verify published website, administration and private file isolation
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://bpreg.tw1.ru/api/public.php | grep -q '"primary_phone"'
          curl -fsS --max-time 20 "https://bpreg.tw1.ru/$PBP_ADMIN_PATH/api/admin.php?action=session" | grep -q '"csrf"'
          test "$(curl -s -o /dev/null -w '%{http_code}' https://bpreg.tw1.ru/private/state.php)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' https://bpreg.tw1.ru/private/admin-api/admin.php)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' https://bpreg.tw1.ru/admin/)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' https://bpreg.tw1.ru/api/admin.php?action=session)" = 404
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://bpreg.tw1.ru/$PBP_ADMIN_PATH/api/$PBP_BOOTSTRAP_FILENAME")" = 404

      - name: Confirm new layout and retain original backup
        if: success()
        shell: bash
        run: |
          root_b64="$(printf '%s' "$TIMEWEB_SITE_ROOT" | base64 -w0)"
          ssh -o BatchMode=yes -i "$HOME/.ssh/id_ed25519" -p "$TIMEWEB_SSH_PORT" "$TIMEWEB_SSH_USER@$TIMEWEB_SSH_HOST" "SITE_ROOT_B64='$root_b64' bash -se" < scripts/timeweb-finish.sh

      - name: Restore previous document root if first cutover failed
        if: failure() && steps.cutover.outcome == 'success'
        shell: bash
        run: |
          root_b64="$(printf '%s' "$TIMEWEB_SITE_ROOT" | base64 -w0)"
          ssh -o BatchMode=yes -i "$HOME/.ssh/id_ed25519" -p "$TIMEWEB_SSH_PORT" "$TIMEWEB_SSH_USER@$TIMEWEB_SSH_HOST" "SITE_ROOT_B64='$root_b64' bash -se" < scripts/timeweb-rollback.sh
